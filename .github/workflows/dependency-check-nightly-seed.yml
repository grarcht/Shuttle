name: Seed NVD Cache

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:

jobs:
  seed-nvd-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Restore previous NVD cache (for delta updates)
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-seed-${{ steps.date.outputs.date }}
          restore-keys: |
            nvd-${{ runner.os }}-seed-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate --no-daemon --no-configuration-cache --info

      - name: Save NVD cache
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-seed-${{ steps.date.outputs.date }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report-nightly
          path: build/reports/dependency-check-report.html
          if-no-files-found: warn

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/dependency-check-report.sarif
